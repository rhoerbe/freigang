# Container-only packaging metadata for the `mail` CLI.
#
# The repo-root pyproject.toml declares both mail_cli and mail_renderer. The
# renderer is HOST-side code: it is the only upward path in the mail design and
# it reads the IMAP credential. It must not ship inside the container, so the
# image cannot install from the root pyproject.
#
# Keep name/version in step with the root pyproject when that one changes.
[project]
name = "freigang-mail-cli"
version = "0.1.0"
description = "Container-side read-only Maildir CLI for freigang agents (mail ls / show / attach)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail = "mail_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_cli"]
