[project]
name = "freigang-mail-cli"
version = "0.1.0"
description = "Container-side read-only Maildir CLI for freigang agents (mail ls / show / attach)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mail = "mail_cli.cli:main"
mail-renderer = "mail_renderer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mail_cli", "mail_renderer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
