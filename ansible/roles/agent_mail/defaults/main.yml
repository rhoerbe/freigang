# agent_mail: host-side, one-way DOWN mail sync (mbsync) plus credential placement.
# See issue #37. The container never speaks IMAP and never holds this credential; all
# IMAP traffic happens here, on the host, as this role's user (ha_agent is the first
# consumer, not a hard-coded assumption of this role).

# Host system account whose mailbox is being synced.
agent_mail_username: ha_agent
agent_mail_home: "/home/{{ agent_mail_username }}"

# Mailbox being synced -- a real Hetzner mailbox with its own password (not an alias
# into a personal mailbox). Note: Hetzner mailbox passwords authenticate SMTP as well as
# IMAP, so the "agent cannot send mail" guarantee rests entirely on this credential never
# entering the container (see agent_mail_credential_dir below), not on the credential
# itself being incapable of sending.
agent_mail_address: ha_agent@hoerbe.at

# IMAP host -- always a hostname, never an IP: Hetzner shared-hosting IPs can renumber.
# hoerbe.at MX -> www646.your-server.de; mail.your-server.de also resolves to the same
# shared-hosting cluster.
agent_mail_imap_host: mail.your-server.de
agent_mail_imap_port: 993

# mbsync channel/account name, local to the generated mbsyncrc.
agent_mail_channel: hoerbe

# Local Maildir target. Deliberately OUTSIDE {{ agent_mail_home }}/workspace so the
# synced mail is never in the container's writable tree even if a mount were
# misconfigured. A later phase mounts this read-only at /mail, a sibling of /sessions.
agent_mail_maildir: "{{ agent_mail_home }}/mail"

# Credential + mbsync config directory. A SIBLING of workspace, deliberately never
# mounted into the container. Do NOT move this under
# {{ agent_mail_home }}/workspace/.secrets/: that path no longer even exists as a
# secret store (issue #38 moved it to {{ agent_mail_home }}/.secrets/, a sibling of
# workspace), but workspace itself is still bind-mounted wholesale at /workspace
# (scripts/start_container.sh) and anything placed under it would be readable from
# inside the container regardless of TUI selection.
agent_mail_credential_dir: "{{ agent_mail_home }}/.mailsync"

# Operator-supplied IMAP password. Leave undefined here -- never set a real value in
# this repo, and do NOT add an ansible-vault file to this repo to hold it.
#
# This repo is PUBLIC. ansible-vault ciphertext committed here would be published
# permanently for offline attack against the vault passphrase, and that passphrase is
# shared with a private repo's vault (see hosting's ADR-0001, which keeps the password
# in KeePassXC at ~/.ansible-vault-pass). A public repo turns a shared passphrase into a
# shared liability, so the mail credential -- which is deployment-specific anyway and has
# no business in a general-purpose project -- stays out of git entirely.
#
# Sanctioned path: place the password by hand on the target host, once:
#
#   read -rs pw && printf '%s' "$pw" \
#     | sudo install -o ha_agent -g ha_agent -m600 /dev/stdin \
#       /home/ha_agent/.mailsync/imap_password
#
# `printf '%s'` writes no trailing newline, which keeps mbsync's PassCmd clean. With this
# variable left undefined the role installs a placeholder at
# {{ agent_mail_credential_dir }}/imap_password and enforces mode 0600, so a hand-placed
# password survives re-runs. Losing it on a host rebuild costs one copy from KeePassXC --
# unlike a Matrix macaroon key, rotating an IMAP password destroys nothing.
#
# agent_mail_imap_password is still honoured if defined (e.g. passed with -e from a vault
# kept in a PRIVATE repo), so an operator who wants reproducible deploys can have them
# without this repo ever holding the ciphertext.
# agent_mail_imap_password: ""

# Sync cadence. A few minutes of staleness is explicitly acceptable per the design.
agent_mail_sync_interval: 5min
