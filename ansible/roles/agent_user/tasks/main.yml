- name: Create agent user
  ansible.builtin.user:
    name: "{{ agent_username }}"
    comment: "{{ agent_comment }}"
    shell: "{{ agent_shell }}"
    create_home: true
    state: present

- name: Create agent directories
  ansible.builtin.file:
    path: "/home/{{ agent_username }}/{{ item }}"
    state: directory
    owner: "{{ agent_username }}"
    group: "{{ agent_username }}"
    mode: "0700"
  loop: "{{ agent_directories }}"

- name: Enable lingering for agent user
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ agent_username }}
  register: linger_result
  changed_when: linger_result.rc == 0
  failed_when: false

- name: Copy container files to agent home
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "/home/{{ agent_username }}/{{ item.dest }}"
    owner: "{{ agent_username }}"
    group: "{{ agent_username }}"
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ playbook_dir }}/../../containerize/mcp-config.json", dest: ".claude/claude_code_config.json", mode: "0644" }
    - { src: "{{ playbook_dir }}/../../containerize/mcp-config.json", dest: "mcp-config.json", mode: "0644" }
    - { src: "{{ playbook_dir }}/../../containerize/mcp-manifest.json", dest: "mcp-manifest.json", mode: "0644" }
    - { src: "{{ playbook_dir }}/../../containerize/build.sh", dest: "build.sh", mode: "0755" }
    - { src: "{{ playbook_dir }}/../../containerize/Dockerfile", dest: "Dockerfile", mode: "0644" }
    - { src: "{{ playbook_dir }}/../../containerize/test_container.sh", dest: "test_container.sh", mode: "0755" }
    - { src: "{{ playbook_dir }}/../../scripts/start_container.sh", dest: "start_container.sh", mode: "0755" }
    - { src: "{{ playbook_dir }}/../../scripts/config.sh", dest: "config.sh", mode: "0755" }
    - { src: "{{ playbook_dir }}/../../scripts/launcher_tui.py", dest: "launcher_tui.py", mode: "0755" }
    - { src: "{{ playbook_dir }}/../../scripts/sync_mail.sh", dest: "sync_mail.sh", mode: "0755" }
